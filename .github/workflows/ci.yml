name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static checks (PowerShell 7)
        shell: pwsh
        run: ./tests/Test-WhyNotStatic.ps1

      - name: Static checks (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Test-WhyNotStatic.ps1

      - name: Smoke - reserved name must be FATAL
        shell: powershell
        run: |
          $out = ./WhyNot.ps1 "$env:TEMP\CON.txt" -Op Read -Json | ConvertFrom-Json
          if (-not ($out | Where-Object { $_.Cause -eq 'Reserved device name' -and $_.Severity -eq 'FATAL' })) {
            throw 'Reserved-name finding missing'
          }

      - name: Smoke - JSON is always an array
        shell: pwsh
        run: |
          $raw = ./WhyNot.ps1 "$env:TEMP\whynot-missing-12345.dll" -Op Write -Json
          if (($raw | Out-String).TrimStart() -notmatch '^\[') { throw 'JSON output is not an array' }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path ./WhyNot.ps1 -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer errors' }
